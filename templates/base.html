<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}VulnMachine{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --bg:          #000300;
  --surface:     #010d01;
  --card:        #000f00;
  --border:      #0a5c1a;
  --green:       #00ff41;
  --green-dim:   #00aa2a;
  --green-dark:  #004d10;
  --text:        #00cc33;
  --muted:       #1a5c28;
  --warn:        #ffb300;
  --danger:      #ff4400;
  --font-mono:   'Share Tech Mono', 'Courier New', monospace;
  --font-vt:     'VT323', 'Courier New', monospace;
  --glow:        0 0 6px rgba(0,255,65,0.6), 0 0 14px rgba(0,255,65,0.25);
  --glow-dim:    0 0 4px rgba(0,255,65,0.35);
  --glow-text:   0 0 8px rgba(0,255,65,0.5);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 0.92rem;
  min-height: 100vh;
  line-height: 1.65;
  position: relative;
}

/* CRT scanlines */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0, 0, 0, 0.13) 2px,
    rgba(0, 0, 0, 0.13) 4px
  );
  pointer-events: none;
  z-index: 9999;
}

/* Subtle phosphor flicker */
@keyframes flicker {
  0%, 92%, 100% { opacity: 1; }
  93%           { opacity: 0.96; }
  97%           { opacity: 0.98; }
}
body { animation: flicker 10s infinite; }

/* ── Navbar ── */
nav {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 1.5rem;
  height: 48px;
  display: flex;
  align-items: center;
  gap: 1.5rem;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 12px rgba(0,255,65,0.06);
}

.nav-brand {
  font-family: var(--font-vt);
  font-size: 1.5rem;
  color: var(--green);
  text-decoration: none;
  letter-spacing: 4px;
  text-shadow: var(--glow);
  white-space: nowrap;
}

.nav-prompt {
  color: var(--green-dim);
  font-size: 1.1rem;
  margin-right: -1rem;
}

.nav-links {
  display: flex;
  gap: 0;
  flex: 1;
  flex-wrap: wrap;
}

.nav-links a {
  color: var(--muted);
  text-decoration: none;
  font-size: 0.75rem;
  letter-spacing: 1px;
  padding: 0.25rem 0.7rem;
  border: 1px solid transparent;
  border-right: 1px solid var(--border);
  transition: all 0.1s;
  text-transform: uppercase;
}

.nav-links a:first-child { border-left: 1px solid var(--border); }

.nav-links a:hover {
  color: var(--green);
  background: rgba(0,255,65,0.05);
  text-shadow: var(--glow-dim);
}

.nav-links a.active {
  color: var(--green);
  background: rgba(0,255,65,0.08);
  text-shadow: var(--glow-dim);
}

.nav-status {
  font-size: 0.72rem;
  color: var(--green);
  letter-spacing: 2px;
  text-shadow: var(--glow-dim);
  animation: blink-status 3s step-end infinite;
}

@keyframes blink-status {
  0%, 80%, 100% { opacity: 1; }
  85% { opacity: 0.3; }
}

/* Blinking cursor */
.cursor {
  display: inline-block;
  width: 9px;
  height: 1.1em;
  background: var(--green);
  vertical-align: text-bottom;
  animation: blink 1s step-end infinite;
  box-shadow: var(--glow-dim);
}

@keyframes blink { 50% { opacity: 0; } }

/* ── Layout ── */
main {
  max-width: 1100px;
  margin: 0 auto;
  padding: 2rem 1.5rem 4rem;
}

/* ── Cards ── */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  padding: 1.4rem;
  position: relative;
}

/* ── Terminal window card ── */
.terminal-window {
  background: var(--card);
  border: 1px solid var(--border);
  position: relative;
}

.terminal-titlebar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0.3rem 0.8rem;
  font-size: 0.68rem;
  color: var(--muted);
  letter-spacing: 2px;
  text-transform: uppercase;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.terminal-titlebar-dots {
  display: flex;
  gap: 4px;
}

.terminal-titlebar-dots span {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--muted);
  opacity: 0.4;
}

.terminal-body { padding: 1.2rem; }

/* ── Headings ── */
h1 {
  font-family: var(--font-vt);
  font-size: 2.4rem;
  color: var(--green);
  letter-spacing: 4px;
  text-shadow: var(--glow);
  margin-bottom: 0.3rem;
  line-height: 1.1;
}

h2 {
  font-family: var(--font-mono);
  font-size: 0.95rem;
  font-weight: normal;
  color: var(--text);
  letter-spacing: 1px;
  margin-bottom: 0.8rem;
}

h3 {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  color: var(--muted);
  letter-spacing: 2px;
  margin-bottom: 1rem;
  text-transform: uppercase;
}

/* ── Forms ── */
.form-group { margin-bottom: 1.1rem; }

label {
  display: block;
  font-size: 0.75rem;
  letter-spacing: 1px;
  color: var(--green-dim);
  margin-bottom: 0.3rem;
  text-transform: uppercase;
}

input[type=text],
input[type=password],
input[type=search] {
  width: 100%;
  background: #000;
  border: 1px solid var(--border);
  color: var(--green);
  font-family: var(--font-mono);
  font-size: 0.92rem;
  padding: 0.45rem 0.8rem;
  outline: none;
  border-radius: 0;
  transition: border-color 0.12s, box-shadow 0.12s;
  caret-color: var(--green);
}

input:focus {
  border-color: var(--green-dim);
  box-shadow: 0 0 0 1px var(--green-dark), 0 0 10px rgba(0,255,65,0.15);
}

input::placeholder { color: var(--muted); }

/* ── Buttons ── */
.btn {
  display: inline-block;
  padding: 0.45rem 1.4rem;
  font-family: var(--font-mono);
  font-size: 0.82rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  border: 1px solid;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.12s;
  border-radius: 0;
  background: transparent;
}

.btn-primary {
  border-color: var(--green-dim);
  color: var(--green-dim);
}
.btn-primary:hover {
  background: var(--green-dim);
  color: #000;
  box-shadow: 0 0 12px rgba(0,255,65,0.3);
  text-shadow: none;
}

.btn-danger {
  border-color: var(--danger);
  color: var(--danger);
}
.btn-danger:hover {
  background: var(--danger);
  color: #000;
  box-shadow: 0 0 12px rgba(255,68,0,0.35);
}

.btn-ghost {
  border-color: var(--muted);
  color: var(--muted);
}
.btn-ghost:hover {
  border-color: var(--green-dim);
  color: var(--green-dim);
}

/* ── Alerts ── */
.alert {
  padding: 0.55rem 1rem;
  font-size: 0.83rem;
  margin-bottom: 1rem;
  border-left: 2px solid;
  font-family: var(--font-mono);
  line-height: 1.5;
}

.alert-success {
  background: rgba(0,255,65,0.04);
  border-color: var(--green-dim);
  color: var(--green-dim);
}

.alert-error {
  background: rgba(255,68,0,0.04);
  border-color: var(--danger);
  color: var(--danger);
}

.alert-info {
  background: rgba(0,255,65,0.02);
  border-color: var(--muted);
  color: var(--text);
}

.alert-warn {
  background: rgba(255,179,0,0.04);
  border-color: var(--warn);
  color: var(--warn);
}

/* ── Flag display ── */
.flag-box {
  background: rgba(0,255,65,0.04);
  border: 1px solid var(--green);
  padding: 1.2rem;
  margin: 1rem 0;
  text-align: center;
  animation: flag-pulse 2s ease-in-out infinite alternate;
}

@keyframes flag-pulse {
  from { box-shadow: 0 0 8px rgba(0,255,65,0.2); }
  to   { box-shadow: 0 0 28px rgba(0,255,65,0.45); }
}

.flag-box .flag-label {
  font-size: 0.62rem;
  color: var(--green-dim);
  letter-spacing: 5px;
  text-transform: uppercase;
  margin-bottom: 0.5rem;
}

.flag-box .flag-value {
  font-family: var(--font-vt);
  font-size: 1.5rem;
  color: var(--green);
  text-shadow: var(--glow-text);
  letter-spacing: 2px;
  word-break: break-all;
}

/* ── Table ── */
.data-table {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--font-mono);
  font-size: 0.8rem;
  margin-top: 1rem;
}

.data-table th {
  background: var(--surface);
  color: var(--green-dim);
  font-size: 0.68rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 0.35rem 0.8rem;
  border: 1px solid var(--border);
  text-align: left;
}

.data-table td {
  padding: 0.35rem 0.8rem;
  border: 1px solid rgba(10,92,26,0.4);
  color: var(--text);
}

.data-table tr:hover td {
  background: rgba(0,255,65,0.03);
  color: var(--green);
}

/* ── Badges ── */
.badge {
  display: inline-block;
  padding: 1px 6px;
  font-size: 0.62rem;
  letter-spacing: 1px;
  text-transform: uppercase;
  border: 1px solid;
  border-radius: 0;
  font-family: var(--font-mono);
}

.badge-easy   { color: var(--green-dim);  border-color: var(--green-dim);  background: rgba(0,255,65,0.06); }
.badge-medium { color: var(--warn);       border-color: var(--warn);       background: rgba(255,179,0,0.06); }
.badge-hard   { color: var(--danger);     border-color: var(--danger);     background: rgba(255,68,0,0.06); }

/* ── Hint ── */
.hint-box {
  background: var(--card);
  border: 1px dashed var(--border);
  padding: 0.9rem 1.1rem;
  margin-top: 1rem;
}

.hint-title {
  font-size: 0.62rem;
  letter-spacing: 3px;
  color: var(--green-dim);
  text-transform: uppercase;
  margin-bottom: 0.5rem;
}

.hint-box p {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  color: var(--text);
  line-height: 1.75;
}

.hint-box code {
  background: rgba(0,255,65,0.07);
  color: var(--green);
  padding: 0 4px;
  border: 1px solid var(--green-dark);
  font-family: var(--font-mono);
}

/* ── Misc helpers ── */
.sep {
  border: none;
  border-top: 1px solid var(--border);
  margin: 1.5rem 0;
}

.text-mono    { font-family: var(--font-mono); }
.text-muted   { color: var(--muted); }
.text-accent  { color: var(--green); text-shadow: var(--glow-dim); }
.text-danger  { color: var(--danger); }
.text-success { color: var(--green); text-shadow: var(--glow-dim); }
.text-warn    { color: var(--warn); }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.2rem; }

.mt-1 { margin-top: 0.5rem; }
.mt-2 { margin-top: 1rem; }
.mt-3 { margin-top: 1.5rem; }
.mb-1 { margin-bottom: 0.5rem; }
.mb-2 { margin-bottom: 1rem; }

.flex { display: flex; align-items: center; }
.gap-1 { gap: 0.5rem; }
.gap-2 { gap: 1rem; }

/* ── Level nav ── */
.level-nav {
  display: flex;
  gap: 0;
  margin-bottom: 1.5rem;
  border: 1px solid var(--border);
  width: fit-content;
}

.level-nav a {
  padding: 0.35rem 1.1rem;
  border-right: 1px solid var(--border);
  text-decoration: none;
  font-size: 0.75rem;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--muted);
  transition: all 0.12s;
  background: transparent;
}

.level-nav a:last-child { border-right: none; }

.level-nav a:hover {
  color: var(--green-dim);
  background: rgba(0,255,65,0.04);
}

.level-nav a.active {
  color: var(--green);
  background: rgba(0,255,65,0.07);
  text-shadow: var(--glow-dim);
}

/* ── URL bar ── */
.url-bar {
  background: #000;
  border: 1px solid var(--border);
  padding: 0.3rem 0.8rem;
  font-size: 0.75rem;
  color: var(--muted);
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-family: var(--font-mono);
}

.url-bar .method { color: var(--green); }
.url-bar .path   { color: var(--text); }

/* ── Code block ── */
.code-block {
  background: #000;
  border: 1px solid var(--border);
  padding: 1rem;
  overflow: auto;
  color: var(--text);
  line-height: 1.7;
  font-family: var(--font-mono);
  font-size: 0.8rem;
}

/* ── Prompt line ── */
.prompt-line {
  font-family: var(--font-mono);
  font-size: 0.82rem;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 0.4rem;
}

.prompt-line::before {
  content: '$';
  color: var(--green-dim);
}

/* ── Footer ── */
footer {
  border-top: 1px solid var(--border);
  padding: 0.9rem 1.5rem;
  font-size: 0.7rem;
  color: var(--muted);
  background: var(--surface);
  display: flex;
  align-items: center;
  gap: 0.6rem;
}

footer::before {
  content: 'root@vulnmachine:~$';
  color: var(--green-dim);
  flex-shrink: 0;
}

/* ── Responsive ── */
@media (max-width: 700px) {
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
  nav { gap: 0.8rem; }
  .nav-links { gap: 0; }
}
</style>
{% block extra_head %}{% endblock %}
</head>
<body>

<nav>
  <span class="nav-prompt">$</span>
  <a href="/" class="nav-brand">VULNMACHINE</a>
  <div class="nav-links">
    <a href="/challenge/1">[C1]&nbsp;Login</a>
    <a href="/challenge/2">[C2]&nbsp;Error</a>
    <a href="/challenge/3">[C3]&nbsp;Union</a>
    <a href="/challenge/4">[C4]&nbsp;Blind</a>
    <a href="/challenge/5">[C5]&nbsp;Search</a>
    <a href="/challenge/6">[C6]&nbsp;Order</a>
    <a href="/challenge/7">[C7]&nbsp;XSS</a>
    <a href="/scoreboard">[Score]</a>
  </div>
  <span class="nav-status">● LIVE</span>
</nav>

<main>
  {% block content %}{% endblock %}
</main>

<footer>
  VulnMachine v1.0 &nbsp;·&nbsp; SQL Injection Lab &nbsp;·&nbsp; Uso educativo &nbsp;·&nbsp;
  <span style="color:var(--danger);">⚠ No exponer en producción</span>
</footer>

</body>
</html>
